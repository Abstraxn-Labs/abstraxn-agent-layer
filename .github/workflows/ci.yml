name: prod-backend-agent-layer-service-ci-deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Image and Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Ensure this job runs only on prod branch
    
    env:
      REPOSITORY: prod-backend-agent-layer-service
      ORG_NAME: swr.ap-southeast-2.myhuaweicloud.com/prod-abstraxn

    steps:
      - name: Check out code
        uses: actions/checkout@v2
        
      - name: Disable BuildKit for Huawei SWR
        run: echo "DOCKER_BUILDKIT=0" >> $GITHUB_ENV
        
      - name: Login to Huawei SWR
        run: |
          docker login swr.ap-southeast-2.myhuaweicloud.com -u ${{ secrets.HUAWEI_CLOUD_SWR_USERNAME }} -p ${{ secrets.HUAWEI_CLOUD_SWR_PASSWORD }}

      - name: Generate date-based tag
        id: date-tag
        run: |
          CURRENT_DATE=$(date +'%d-%m-%Y')
          CURRENT_TIME=$(date +'%H-%M-%S')
          IMAGE_TAG="${CURRENT_DATE}_${CURRENT_TIME}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Using tag: $IMAGE_TAG"

      - name: Build and tag Docker Image
        run: |
            docker build --platform linux/amd64 --no-cache -t $ORG_NAME/$REPOSITORY:${{ env.IMAGE_TAG }} .

      - name: Push image to Amazon ECR
        run: |
          docker push $ORG_NAME/$REPOSITORY:${{ env.IMAGE_TAG }}

      - name: Trigger Workflow B
        uses: peter-evans/repository-dispatch@v1
        with:
          token: ${{ secrets.PROD_GITHUB_TOKEN }}
          repository: Abstraxn-Labs/prod-huawei-argocd
          event-type: trigger-workflow-prod-backend-agent-layer-service
          client-payload: |
            {
              "image_tag": "${{ env.IMAGE_TAG }}",
              "branch": "prod-huawei"
            }
